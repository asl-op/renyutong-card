<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>任禹桐 · 个人主页</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <!-- 全屏星云粒子背景画布 -->
  <canvas id="nebula" class="nebula"></canvas>

  <!-- 顶部固定导航（4 个按钮） -->
  <header class="nav">
    <nav class="nav-links">
      <a href="/">主页</a>
      <a href="/projects">项目</a>
      <a href="/about">关于我</a>
      <a href="/reads">阅读</a>
    </nav>
  </header>

  <!-- 主页 hero：极简留白排版 -->
  <main class="hero">
    <p class="hero-eyebrow">Welcome to my universe</p>
    <h1 class="hero-title grad-text" data-site="name">任禹桐</h1>
    <p class="hero-sub" data-site="tagline">学生 · 开发者 · 终身学习者</p>
    <p class="hero-intro" data-site="intro">在代码与文字之间，探索世界的秩序与美。</p>
    <div class="hero-actions">
      <a class="btn" href="/projects">浏览项目</a>
      <a class="btn ghost" href="/reads">阅读星图</a>
    </div>
  </main>

  <!-- 页脚：预留联系方式 -->
  <footer class="footer">
    <span data-site="email">d.gloss.ad@gmail.com</span>
    <span class="sep">·</span>
    <a href="https://github.com/asl-op" data-site="github" target="_blank" rel="noopener">GitHub</a>
  </footer>

  <script src="/js/nebula.js"></script>
  <script src="/js/main.js"></script>
  <script src="/js/audio.js"></script>
</body>
</html>
