<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>关于我 · 任禹桐</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <!-- 全屏星云粒子背景画布 -->
  <canvas id="nebula" class="nebula"></canvas>

  <!-- 顶部固定导航 -->
  <header class="nav">
    <nav class="nav-links">
      <a href="/">主页</a>
      <a href="/projects">项目</a>
      <a href="/about">关于我</a>
      <a href="/reads">阅读</a>
    </nav>
  </header>

  <!-- 关于我页面：极简卡片排版 -->
  <main class="about">
    <div class="about-card">
      <!-- 头像：纯 CSS 星云球体，无外部图片 -->
      <div class="avatar">任</div>
      <h1 class="about-name" data-site="name">任禹桐</h1>
      <p class="about-en" data-site="englishName">Ren Yutong</p>
      <p class="about-bio" data-site="bio">你好，我是任禹桐。</p>

      <!-- 技能标签：由 main.js 从 /api/site 动态构建 -->
      <div id="aboutSkills" class="about-skills"></div>

      <!-- 联系方式列表：由 main.js 从 /api/site 动态构建 -->
      <div id="aboutContact" class="contact-list"></div>
    </div>
  </main>

  <script src="/js/nebula.js"></script>
  <script src="/js/main.js"></script>
</body>
</html>
