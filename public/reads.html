<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>阅读 · 任禹桐</title>
  <link rel="stylesheet" href="/css/style.css?v=20260816b">
</head>
<body>
  <!-- 全屏星云粒子背景画布 -->
  <canvas id="nebula" class="nebula"></canvas>

  <!-- 顶部固定导航（4 个按钮） -->
  <header class="nav">
    <nav class="nav-links">
      <a href="/">主页</a>
      <a href="/projects">项目</a>
      <a href="/about">关于我</a>
      <a href="/reads">阅读</a>
    </nav>
  </header>

  <!-- 径向圈层星图页面 -->
  <main class="page reads-page">
    <div class="page-head">
      <h2 class="page-title">阅读</h2>
      <p class="page-desc">书单与笔记，是散落在轨道上的思想星尘 · 悬浮星体查看详情</p>
    </div>

    <div class="reads-layout">
      <!-- 左侧统计卡片（书籍总数 / 笔记数量） -->
      <div id="readsStats" class="reads-stats"></div>

      <!-- 径向圈层星图：中心 ME + 同心轨道 + 四象限星体节点 -->
      <div id="starmap" class="starmap">
        <div class="starmap-quadrants"></div>
        <div class="starmap-system"></div>
        <div class="starmap-core">ME</div>
      </div>
    </div>
  </main>

  <!-- 悬浮详情卡片（星体节点 tooltip） -->
  <div id="hoverCard" class="hover-card"></div>

  <!-- 页脚：预留联系方式 -->
  <footer class="footer">
    <a href="mailto:d.gloss.ad@gmail.com">d.gloss.ad@gmail.com</a>
    <span class="sep">·</span>
    <a href="https://github.com/asl-op" target="_blank" rel="noopener">GitHub</a>
  </footer>

  <script src="/js/nebula.js?v=20260816b"></script>
  <script src="/js/main.js?v=20260816b"></script>
  <script src="/js/audio.js?v=20260816b"></script>
  <script src="/js/starmap.js?v=20260816b"></script>
</body>
</html>
