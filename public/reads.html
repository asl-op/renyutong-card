<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>阅读 · 任禹桐</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <!-- 全屏星云粒子背景画布 -->
  <canvas id="nebula" class="nebula"></canvas>

  <!-- 顶部固定导航 -->
  <header class="nav">
    <nav class="nav-links">
      <a href="/">主页</a>
      <a href="/projects">项目</a>
      <a href="/about">关于我</a>
      <a href="/reads">阅读</a>
    </nav>
  </header>

  <!-- 太阳系同心环形星轨页面 -->
  <main class="orbit-page">
    <div class="page-head">
      <h2 class="page-title">阅读</h2>
      <p class="page-desc">读书与随笔，是散落在轨道上的思想星尘 · 悬浮查看详情</p>
    </div>
    <!-- 星轨舞台：data-api 指定数据来源 -->
    <div id="orbitStage" class="orbit-stage" data-api="/api/reads"></div>
  </main>

  <!-- 悬浮详情卡片 -->
  <div id="hoverCard" class="hover-card"></div>

  <script src="/js/nebula.js"></script>
  <script src="/js/main.js"></script>
  <script src="/js/orbit.js"></script>
</body>
</html>
