<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>后台管理 · 任禹桐</title>
  <link rel="stylesheet" href="/css/style.css?v=20260816">
</head>
<body>
  <!-- 全屏星云粒子背景画布 -->
  <canvas id="nebula" class="nebula"></canvas>

  <!-- 顶部固定导航（4 个按钮） -->
  <header class="nav">
    <nav class="nav-links">
      <a href="/">主页</a>
      <a href="/projects">项目</a>
      <a href="/about">关于我</a>
      <a href="/reads">阅读</a>
    </nav>
  </header>

  <!-- 后台可视化管理 -->
  <main class="admin">
    <h1>后台管理</h1>

    <!-- 分类切换：项目 / 阅读 -->
    <div class="admin-tabs">
      <button class="admin-tab active" data-type="projects">项目</button>
      <button class="admin-tab" data-type="reads">阅读</button>
    </div>

    <!-- 列表 + 表单由 admin.js?v=20260816 按配置动态生成 -->
    <div id="adminRoot"></div>

    <p class="admin-tip">
      提示：新增 / 编辑 / 删除后，数据会立即写入 data 目录下的 JSON 文件，前端「项目」「阅读」页面会自动刷新渲染，无需改动任何前端代码。
      写操作需要管理密码：本地首次启动自动生成（控制台会打印，保存在 data/.admin-password）；部署版在 Render 后台 Environment 里设置 ADMIN_PASSWORD。
    </p>
  </main>

  <script src="/js/nebula.js?v=20260816"></script>
  <script src="/js/audio.js?v=20260816"></script>
  <script src="/js/admin.js?v=20260816"></script>
</body>
</html>
